[package]
name = "uifipill"
version = "1.0.0"
description = "UIFIPILL - WiFi suite desktop for Windows"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uifipill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
chrono = "0.4"
which  = "6"
dirs   = "5"
encoding_rs = "0.8"
futures = "0.3"
md5 = "0.7"
sha1 = "0.10"
libloading = "0.8"
tokio = { version = "1", features = ["time", "macros", "rt"] }
